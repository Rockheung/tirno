name: gate-regression

# Gate 층 — 진짜 Chrome 위에서 tirno 를 돌린다. **PR 을 막지 않는다.**
#
# 보는 것은 하나다: Chrome 계약(gate-check). 명령이 실제로 도는가(smoke)는
# ci.yml 의 PR 게이트로 옮겼다 — 그건 우리 코드의 회귀라 PR 을 세워야 한다.
#
# 여기 남은 것의 목적은 회귀 차단이 아니라 통보다. tirno 의 앵커 설계는 Chrome 의 관측된 행동
# (port 0 일 때만 DevToolsActivePort 를 쓴다 / 재기동하면 새 포트를 담는다)에
# 얹혀 있고, 그건 문서화된 계약이 아니다. Chrome 이 그걸 바꾸면 유닛 186개는
# 전부 초록인 채 런타임만 죽는다 — 그때 여기서 빨간불이 뜨는 것이 목적.
#
# 근거와 측정 기록: docs/plan-anchor-broker.md §7
#
# 수동 트리거로 둔다. Chrome 이 계약을 깨는 일은 드물고, 깨져도 우리가 고칠 수 있는
# 게 아니라 알아야 하는 것이다 — 정기 실행으로 매일 초록을 찍는 건 값이 없다.
# 새 Chrome 이 나왔거나 앵커 쪽을 건드렸을 때 손으로 돌린다.

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Chrome 확인
        run: |
          which google-chrome || which google-chrome-stable || which chromium-browser
          google-chrome --version || google-chrome-stable --version

      - name: Gate 1·2
        # CI 컨테이너에서는 chrome 샌드박스가 뜨지 않는다.
        env:
          CHROME_FLAGS: '--no-sandbox --disable-dev-shm-usage'
        run: node scripts/gate-check.mjs
