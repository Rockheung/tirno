name: release

# 자체 실행 바이너리를 굽는다 — Node 를 따로 깔지 않고 받아서 바로 쓰게.
#
# npm 은 안 쓴다. bun 이 런타임까지 한 파일에 묶어 주고, 한 머신에서 다른 타깃까지
# 교차 컴파일한다 — Node SEA 처럼 타깃별 node 바이너리를 구해 올 필요가 없다.
#
# Windows 는 대상이 아니다. 소유권 판정이 `lsof` 와 `ps` 를 읽는다(core/inventory.ts).
#
# 태그를 밀면 릴리즈에 붙고, 손으로 돌리면 아티팩트만 남긴다 — 태그 없이 확인하려고.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # 이 파이프라인이 바뀌면 PR 에서 스스로 돈다. 릴리즈 날에 처음 돌려보는 것은
  # 확인이 아니라 도박이다.
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/smoke.mjs']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-x64
          - bun-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 타입체크와 dist 는 tsc 가 낸다. bun 은 그 산출물을 묶기만 한다 —
      # 빌드 파이프라인을 둘로 만들지 않으려는 것이다.
      - run: npm ci
      - run: npm run build

      - name: 바이너리
        run: |
          bun build dist/main.js \
            --compile --target=${{ matrix.target }} \
            --outfile tirno-${{ matrix.target }}

      # 굽기만 하고 안 돌려보면 깨진 것을 올리게 된다. 리눅스 x64 는 이 러너에서
      # 그대로 실행되므로 여기서 본다. 나머지 타깃은 아키텍처가 달라 못 돌린다.
      - name: 실행 확인 (native 타깃만)
        if: matrix.target == 'bun-linux-x64'
        run: |
          ./tirno-bun-linux-x64 --version
          ./tirno-bun-linux-x64 schema | jq '.commands | length'
          ./tirno-bun-linux-x64 ls
          # lighthouse 는 번들에 없어야 한다 (#216) — 있으면 크기가 도로 두 배다
          ! grep -c "lighthouse-core\|LighthouseError" tirno-bun-linux-x64 >/dev/null || (echo "lighthouse is in the bundle" && exit 1)
          ls -la tirno-bun-linux-x64 | awk '{print "binary size:", $5/1048576 " MB"}'

      - uses: actions/upload-artifact@v4
        with:
          name: tirno-${{ matrix.target }}
          path: tirno-${{ matrix.target }}

  # 바이너리에서만 깨지는 것이 있다(bun 의 console.log 가 stdout 가로채기를 건너뛰는 것 등).
  # 그래서 노드로 도는 CI 스모크와 별도로, 배포할 그 바이너리로 스모크 전체를 돌린다.
  smoke-binary:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            chrome-flags: '--no-sandbox --disable-dev-shm-usage'
          - target: bun-darwin-arm64
            os: macos-latest
            chrome-flags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # audit 이 쓰는 lighthouse 는 레포의 node_modules 에서 온다
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tirno-${{ matrix.target }}
          path: bin-dist
      - run: chmod +x bin-dist/tirno-${{ matrix.target }}
      - name: 바이너리 스모크
        env:
          TIRNO_BIN: ${{ github.workspace }}/bin-dist/tirno-${{ matrix.target }}
          CHROME_FLAGS: ${{ matrix.chrome-flags }}
        run: node scripts/smoke.mjs

  release:
    needs: [build, smoke-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - run: |
          cd dist-bin && sha256sum tirno-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/tirno-*
            dist-bin/SHA256SUMS
          generate_release_notes: true
