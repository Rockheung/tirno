<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7ecf2"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a33"/>
      <stop offset="1" stop-color="#11161c"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)"/>
  </g>
  <g stroke="#ffffff" stroke-width="12" stroke-linejoin="round">
    <path d="M512 512 L260.9 367 A290 290 0 0 1 763.1 367 Z" fill="#ea4335"/>
    <path d="M512 512 L763.1 367 A290 290 0 0 1 512 802 Z" fill="#fbbc05"/>
    <path d="M512 512 L512 802 A290 290 0 0 1 260.9 367 Z" fill="#34a853"/>
  </g>
  <circle cx="512" cy="512" r="120" fill="#ffffff"/>
  <circle cx="512" cy="512" r="104" fill="#4285f4"/>
  <g clip-path="url(#plateClip)">
    <polygon points="220,100 420,100 100,420 100,220" fill="url(#ribbon)"/>
    <text x="210" y="210" transform="rotate(-45 210 210)" text-anchor="middle" dominant-baseline="central"
          fill="#6ef0c0" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
          font-size="58" font-weight="800" letter-spacing="7">TIRNO</text>
  </g>
</svg>
