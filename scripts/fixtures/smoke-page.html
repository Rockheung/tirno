<!doctype html>
<meta charset="utf-8">
<title>tirno smoke</title>
<style>body{font:16px system-ui;margin:24px} #box{width:200px;height:120px;background:#eee;margin:12px 0} .tall{height:2000px} #cover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4)} #cover.on{display:block}</style>
<h1 id="head">tirno smoke page</h1>
<a id="link" href="#gone">go to anchor</a>
<form>
  <input id="text" type="text" placeholder="type here">
  <textarea id="area" rows="2"></textarea>
  <select id="sel"><option value="a">A</option><option value="b">B</option></select>
  <input id="check" type="checkbox">
  <input id="file" type="file">
  <button id="btn" type="button">click me</button>
  <input id="ro" type="text" readonly value="locked">
  <input id="short" type="text" maxlength="3">
</form>
<div id="box">drag target</div>
<p id="status">idle</p>
<div id="cover" class="modal-backdrop"></div>
<button id="under" type="button">under</button>
<img id="dot" src="dot.png" alt="" width="1" height="1">
<div class="tall"></div>
<p id="bottom">bottom marker</p>
<table id="orders"><tr><th>Item</th><th>Qty</th></tr><tr><td>Apple</td><td>3</td></tr><tr><td>Pear</td><td>1</td></tr></table>
<p>A paragraph of body text for the reader to find.</p>
<script>
  document.getElementById('btn').addEventListener('click', () => {
    document.getElementById('status').textContent = 'clicked';
  });
  document.getElementById('under').addEventListener('click', () => {
    document.getElementById('status').textContent = 'under-clicked';
  });
  document.getElementById('link').addEventListener('mouseover', () => {
    document.getElementById('status').textContent = 'hovered';
  });
  console.log('smoke page loaded');
  console.warn('a warning');
  console.error('an error');
  fetch('data:text/plain,hello').catch(() => {});
</script>
